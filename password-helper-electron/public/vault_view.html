<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Helper – Vault View</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/vault.css">
  <script defer src="js/common.js"></script>
  <script defer src="js/vault-data.js"></script>
  <script defer src="js/vault-view.js"></script>
</head>
<body>
  <section class="screen active" aria-labelledby="view-title">
    <div class="card list-card">
      <h1 id="view-title">🔓 Vault View</h1>

      <div class="vault-toolbar">
        <input type="search" id="search" class="field compact" placeholder="Search…  (Ctrl+F)" aria-label="Search entries" autocomplete="off" spellcheck="false">
        <select id="sort" class="field compact" aria-label="Sort entries">
          <option value="name">Name A–Z</option>
          <option value="recent">Recently changed</option>
          <option value="type">Type</option>
        </select>
        <button type="button" class="entry-btn" id="btn-new" title="New entry (Ctrl+N)">➕ New</button>
      </div>

      <div class="health-bar" id="health-bar" aria-label="Vault health">
        <span class="health-count" id="health-count"></span>
        <button type="button" class="chip-filter warning hidden" data-filter="weak" aria-pressed="false"></button>
        <button type="button" class="chip-filter info hidden" data-filter="reused" aria-pressed="false"></button>
        <button type="button" class="chip-filter danger hidden" data-filter="breached" aria-pressed="false"></button>
        <button type="button" class="chip-action" id="btn-breach-scan" title="Checks every saved password against Have I Been Pwned (only 5-character hash prefixes are sent)">🛡️ Check breaches</button>
      </div>

      <div id="vault-list" class="vault-list" aria-live="polite"></div>
      <button type="button" class="btn back-btn" id="btn-back">← Back to Menu</button>
    </div>
  </section>
</body>
</html>
