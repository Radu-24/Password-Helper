<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Helper – Login</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <script defer src="js/common.js"></script>
  <script defer src="js/policy.js"></script>
  <script defer src="js/strength.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/login.js"></script>
</head>
<body>
  <section class="screen active" aria-labelledby="login-title">
    <div class="card login-card" id="card">
      <h1 id="login-title">Password Helper</h1>

      <form id="loginForm" data-mode="login">
        <label class="sr-only" for="email">Email</label>
        <input type="email" id="email" class="login-input" placeholder="Email" autocomplete="username" title="" required>

        <div class="password-field">
          <label class="sr-only" for="password">Password</label>
          <input type="password" id="password" class="login-input" placeholder="Password"
                 autocomplete="current-password" title="" required>
          <button type="button" class="reveal-btn" id="togglePassword"><img src="icons/eye.png" alt=""></button>
        </div>

        <div class="password-field hidden" id="confirmWrapper">
          <label class="sr-only" for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" class="login-input" placeholder="Confirm Password" title=""
                 autocomplete="new-password">
          <button type="button" class="reveal-btn" id="toggleConfirmPassword"><img src="icons/eye.png" alt=""></button>
        </div>

        <ul id="passwordRequirements" aria-label="Password requirements">
          <li data-check="length">At least 15 characters</li>
          <li data-check="guess">Hard to guess — no common words, names or your e-mail</li>
          <li data-check="breach">Not found in known data breaches</li>
          <li data-check="match">Both passwords match</li>
        </ul>

        <button type="submit" class="login-btn" id="submitBtn">Log In</button>
      </form>

      <button type="button" id="skipBtn" class="login-btn outline">Skip for now</button>
      <button type="button" id="toggleMode" class="link-btn">Create account</button>
    </div>
  </section>
</body>
</html>
